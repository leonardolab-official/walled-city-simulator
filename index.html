<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>九龍城寨 — Kowloon Walled City</title>
<style>
  :root {
    --ink: #100e0c; --paper: #ffe7df; --teal: #ffc56a;
    --terra: #ff3a2a; --ochre: #d4b56a; --line: #4a342c;
    --on: #2a100e; --gold: #c6a15a; --gold-in: #8d6d38;
    --gap: clamp(8px, 1.4vw, 14px);
    /* Clear of the CRT bezel: 8px frame plus the 16px corner curve. */
    --frame: 24px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--ink); color: var(--paper); }
  body { font-family: "PingFang HK", "Heiti TC", "Hiragino Sans GB", "Noto Sans CJK TC", "Microsoft JhengHei", sans-serif; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; height: 100dvh; }
  #ui {
    position: fixed; inset: 0; height: 100dvh; max-height: 100dvh; pointer-events: none;
    display: grid;
    grid-template-columns: fit-content(72vw) minmax(48px, 1fr) minmax(0, min(34vw, 340px));
    grid-template-rows: minmax(0, 1fr) auto auto;
    grid-template-areas:
      "left . right"
      "walk . ."
      "dock dock dock";
    column-gap: 10px;
    row-gap: 8px;
    padding:
      max(var(--frame), env(safe-area-inset-top))
      max(var(--frame), env(safe-area-inset-right))
      max(var(--frame), env(safe-area-inset-bottom))
      max(var(--frame), env(safe-area-inset-left));
    overflow: hidden;
    align-content: start;
  }
  .panel { pointer-events: auto; background: #120806; border: 1px solid #5a3028; border-radius: 0; max-width: 100%; }
  #col-left, #col-right {
    position: relative; top: auto; left: auto; right: auto; bottom: auto;
    display: flex; flex-direction: column; gap: 8px;
    width: auto; min-width: 0; min-height: 0; max-height: 100%;
    pointer-events: none; overflow: auto; overscroll-behavior: contain;
    scrollbar-width: thin;
  }
  #col-left { grid-area: left; align-self: start; justify-self: start; width: max-content; max-width: 100%; overflow: visible; }
  #col-left:has(#legend.open) { overflow: auto; }
  #col-left > *, #col-right > * { flex-shrink: 0; }
  #col-right { grid-area: right; align-self: start; justify-self: end; align-items: flex-end; width: max-content; max-width: min(340px, 100%); }
  #col-right:has(#card.open) { width: min(340px, 100%); }
  header.panel {
    position: static; align-self: flex-start; width: max-content; max-width: 100%; padding: 8px 12px 9px;
    background: #120806; color: #ffe7df;
    border: 1px solid transparent;
    border-image: linear-gradient(90deg, #ff4a38 0%, #ffc56a 46%, #ffe7a4 54%, #3dff88 100%) 1;
    box-shadow:
      -8px 0 14px rgba(255, 42, 30, 0.45),
      0 0 12px rgba(255, 190, 70, 0.28),
      8px 0 14px rgba(61, 224, 136, 0.45),
      inset -8px 0 10px rgba(255, 42, 30, 0.14),
      inset 8px 0 10px rgba(61, 224, 136, 0.14);
  }
  #tools { position: static; width: min(100%, max-content); max-width: 100%; padding: 0; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; pointer-events: auto; }
  #tools button {
    width: 42px; height: 42px; min-height: 42px; padding: 8px;
    display: inline-flex; align-items: center; justify-content: center;
    background: #1a1411;
  }
  #tools button svg { width: 24px; height: 24px; display: block; }
  #tools button.on svg { filter: drop-shadow(0 0 3px #ff2a22); }
  #card .close { background: #1a1411; }
  .seg { background: #120806; }
  .seg button { background: transparent; }
  /* The legend button sits under the settings mark, and only while the cut tab is on. */
  #ui:not(:has([data-dock="cut"].on)) #toggle-legend { display: none; }
  .head { display: block; }
  h1 {
    font-weight: 700; font-size: clamp(17px, 2vw, 22px); letter-spacing: 0.18em; margin: 0; line-height: 1.2; white-space: nowrap;
    text-shadow: 0 0 6px #ff2a1e, 0 0 16px rgba(255, 30, 20, 0.85);
  }
  h1 > span { color: inherit; font-size: 1em; letter-spacing: 0.18em; display: inline; }
  header.panel h1 { text-shadow: none; }
  h1 > .when {
    display: flex; flex-wrap: nowrap; align-items: baseline; column-gap: 0.55em; row-gap: 1px;
    width: max-content; max-width: 100%;
    margin: 0; color: #ffc56a; font-size: 0.62em; font-weight: 500; letter-spacing: 0.12em; line-height: 1.35;
    text-shadow: 0 0 8px rgba(255, 160, 40, 0.8);
  }
  #wx-read {
    display: inline-flex; flex-wrap: nowrap; align-items: baseline; column-gap: 0.55em; row-gap: 1px;
    width: max-content; max-width: 100%;
    letter-spacing: 0.04em; font-weight: 500;
  }
  #wx-read:empty { display: none; }
  #wx-tod { display: none; }
  #wx-sky::before {
    content: "·"; margin-right: 0.55em; letter-spacing: 0; opacity: 0.55; font-weight: 400;
  }
  .wx-fade { display: inline-grid; }
  .wx-fade > span { grid-area: 1 / 1; }
  .kicker { font-family: "PingFang HK", "Heiti TC", sans-serif; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: #d4b56a; margin-bottom: 2px; overflow-wrap: anywhere; }
  .chrome { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: flex-end; }
  .seg { display: inline-flex; border: 1px solid #4a342c; border-radius: 0; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; margin: 0; min-width: 32px; }
  button { pointer-events: auto; background: #1a1411; color: #e7d7c8; border: 1px solid #4a342c; border-radius: 0; padding: 6px 9px; font-family: "PingFang HK", "Heiti TC", "Hiragino Sans GB", sans-serif; font-size: 12px; letter-spacing: 0.06em; cursor: pointer; min-height: 30px; }
  button.on, button:active {
    background: #2a100e;
    border-color: #ff3a2a;
    color: #fff1ea;
    box-shadow: 0 0 10px rgba(255, 40, 32, 0.75);
    text-shadow: 0 0 8px #ff2a22;
  }
  #tools button.on, #tools button:active,
  #walk-pad button:active,
  .seg button.on, .seg button:active,
  #card .close:active {
    background: #2a100e;
    background-image: none;
    border-color: #ff3a2a;
    color: #fff1ea;
    box-shadow: 0 0 10px rgba(255, 40, 32, 0.75);
    text-shadow: 0 0 8px #ff2a22;
  }
  /* The bottom selection uses the same green tube as a lit place. */
  #zones button.on, #zones button.on:active,
  #controls .tabs button.on, #controls .tabs button.on:active,
  #controls .tabs button:active,
  #walk-pad button.on, #walk-pad button.on:active,
  #walk-pad button:active,
  #settings-panel .seg button.on, #settings-panel .seg button.on:active,
  #settings-panel .seg button:active {
    color: #d8ffd0;
    border-color: #39e07a;
    background: #0e2418;
    background-image: none;
    box-shadow: 0 0 8px rgba(40, 220, 110, 0.65);
    text-shadow: 0 0 6px #3dff88;
  }
  @media (hover: hover) {
    button:hover,
    #tools button:hover,
    #walk-pad button:hover,
    #zones button:hover,
    #zones button.on:hover,
    #controls .tabs button:hover,
    #controls .tabs button.on:hover,
    #walk-pad button.on:hover,
    #card .close:hover {
      border-color: transparent;
      border-image: linear-gradient(90deg, #ff4a38 0%, #ffc56a 46%, #ffe7a4 54%, #3dff88 100%) 1;
      box-shadow:
        -4px 0 6px rgba(255, 42, 30, 0.55),
        0 0 6px rgba(255, 190, 70, 0.32),
        4px 0 6px rgba(61, 224, 136, 0.55);
    }
  }
  #legend, #card {
    display: none; position: relative; width: 100%; max-height: none; overflow: visible; padding: 14px 16px; z-index: 3;
    background: #0e0c0a; color: #f4e7cf; border-radius: 0;
    border: 1px solid transparent;
    border-image: linear-gradient(90deg, #ff4a38 0%, #ffc56a 46%, #ffe7a4 54%, #3dff88 100%) 1;
    box-shadow:
      -8px 0 14px rgba(255, 42, 30, 0.4),
      0 0 12px rgba(255, 190, 70, 0.24),
      8px 0 14px rgba(61, 224, 136, 0.4);
  }
  #card .close { position: absolute; top: 8px; right: 8px; min-width: 28px; min-height: 28px; padding: 0; }
  #card-meta:empty, #card-kicker:empty { display: none; }
  #legend.open, #card.open { display: block; }
  #legend.open { width: min(320px, calc(100vw - 32px)); max-width: min(320px, calc(100vw - 32px)); }
  #controls {
    position: relative; left: auto; right: auto; bottom: auto; transform: none;
    grid-area: dock; justify-self: center;
    width: min(920px, 100%); min-width: 0; max-height: min(46dvh, 320px);
    overflow: auto; overscroll-behavior: contain;
    padding: 8px; display: flex; flex-direction: column; gap: 8px;
    background: rgba(12, 8, 7, 0.92);
    border: 1px solid transparent;
    border-image: linear-gradient(90deg, #ff4a38 0%, #ffc56a 46%, #ffe7a4 54%, #3dff88 100%) 1;
    box-shadow:
      -8px 0 14px rgba(255, 42, 30, 0.4),
      0 0 12px rgba(255, 190, 70, 0.24),
      8px 0 14px rgba(61, 224, 136, 0.4);
  }
  .tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; min-width: 0; }
  .tabs button { width: 100%; min-width: 0; padding-inline: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #walk { flex: 1 1 0; min-width: 0; }
  #walk-pad {
    display: none;
    position: relative; left: auto; bottom: auto;
    grid-area: walk; justify-self: start; align-self: end;
    z-index: 4;
    pointer-events: auto;
    width: max-content;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    touch-action: none;
    user-select: none;
  }
  #walk-stick {
    width: 96px; height: 96px; border-radius: 50%;
    opacity: 0.5;
    position: relative; touch-action: none;
    background: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.05), transparent 64%), #120806;
    border: 1px solid #4a342c;
    box-shadow: inset 0 0 0 8px rgba(0, 0, 0, 0.28);
  }
  #walk-stick i {
    position: absolute; left: 50%; top: 50%;
    width: 40px; height: 40px; border-radius: 50%;
    transform: translate(-50%, -50%);
    background: #3a2c26; border: 1px solid #a07868;
    box-shadow: 0 2px 0 #0c0908, inset 0 1px 0 rgba(255, 220, 190, 0.28);
    pointer-events: none;
  }
  #walk-stick.on i {
    background: #0e2418; border-color: #39e07a;
    box-shadow: 0 0 8px rgba(40, 220, 110, 0.65);
  }
  @media (pointer: coarse), (aspect-ratio <= 1) {
    #walk-pad.on { display: flex; }
  }
  /* Walk starts with the stick and a corner View control. View leaves walk. */
  #walk-view {
    display: none;
    position: absolute;
    right: max(var(--frame), env(safe-area-inset-right));
    bottom: max(var(--frame), env(safe-area-inset-bottom));
    z-index: 5;
    width: 42px;
    height: 42px;
    min-width: 42px;
    min-height: 42px;
    padding: 8px;
    align-items: center;
    justify-content: center;
    pointer-events: auto;
  }
  #walk-view svg { width: 30px; height: 20px; display: block; }
  #ui.walk-bare #walk-view { display: inline-flex; }
  #ui.walk-bare #controls { display: none; }
  #ui.walk-bare {
    grid-template-rows: minmax(0, 1fr) auto;
    grid-template-areas:
      "left . right"
      "walk . .";
  }
  .dock { display: none; gap: 10px 14px; align-items: end; flex-wrap: wrap; }
  .dock.on { display: flex; }
  h2 { font-size: 16px; font-weight: 700; letter-spacing: 0.14em; margin: 2px 0 8px; color: #f4e7cf; }
  p, .swatch { font-family: "PingFang HK", "Heiti TC", sans-serif; font-size: 12px; line-height: 1.5; color: #e4d3b8; }
  .swatch { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
  .swatch i { width: 10px; height: 10px; flex: none; border-radius: 2px; border: 1px solid rgba(255,255,255,0.2); }
  label { font-family: "PingFang HK", "Heiti TC", sans-serif; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: #c6a15a; display: block; margin-bottom: 4px; }
  input[type="range"] { width: 100%; accent-color: var(--terra); }
  .row { flex: 1 1 150px; min-width: 0; }
  .btns { display: flex; flex-wrap: wrap; gap: 6px; }
  .btns button { margin: 0; white-space: normal; text-align: center; line-height: 1.25; max-width: 100%; }
  /* Portrait, and a phone on its side: the View choices stay on one line and slide sideways. */
  @media (aspect-ratio <= 1), (pointer: coarse) {
    #dock-places.on { min-width: 0; width: 100%; align-self: stretch; }
    #dock-places .row { min-width: 0; width: 100%; }
    #zones {
      flex-wrap: nowrap;
      width: 100%;
      max-width: 100%;
      overflow-x: auto;
      overflow-y: hidden;
      overscroll-behavior-x: contain;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-x;
      scrollbar-width: none;
    }
    #zones::-webkit-scrollbar { display: none; }
    #zones button {
      flex: 0 0 auto;
      white-space: nowrap;
      max-width: none;
    }
  }
  #settings-layer[hidden] { display: none !important; }
  body:has(#settings-layer:not([hidden])) #ui { visibility: hidden; }
  #settings-layer {
    position: fixed; inset: 0; z-index: 30;
    display: grid; place-items: center;
    pointer-events: none;
  }
  #settings-scrim {
    position: absolute; inset: 0;
    background: rgba(8, 6, 5, 0.55);
    pointer-events: auto;
  }
  #settings-panel {
    position: relative; z-index: 1;
    width: min(420px, calc(100vw - 32px));
    max-height: min(78dvh, 560px);
    overflow: auto; overscroll-behavior: contain;
    padding: 16px 16px 14px;
    display: flex; flex-direction: column; align-items: stretch; gap: 12px;
    pointer-events: auto;
    background: #0e0c0a; color: #f4e7cf;
    border: 1px solid transparent; border-radius: 0;
    border-image: linear-gradient(90deg, #ff4a38 0%, #ffc56a 46%, #ffe7a4 54%, #3dff88 100%) 1;
    box-shadow:
      -8px 0 14px rgba(255, 42, 30, 0.4),
      0 0 12px rgba(255, 190, 70, 0.24),
      8px 0 14px rgba(61, 224, 136, 0.4);
  }
  #settings-panel h2 { margin: 0 0 2px; }
  #settings-panel .row { flex: none; }
  #settings-panel .seg { flex-wrap: wrap; max-width: 100%; }
  #settings-panel .seg button { flex: 1 1 auto; white-space: nowrap; }
  #settings-panel .note { margin: 0; max-width: 36em; color: rgba(228, 211, 184, 0.62); }
  .switch {
    position: relative;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    margin: 0; min-height: 30px; cursor: pointer;
    text-transform: none; letter-spacing: 0.02em; font-size: 12px; color: var(--paper);
  }
  .switch input {
    position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0;
  }
  .switch i {
    width: 36px; height: 20px; border-radius: 999px; flex: none;
    border: 1px solid #ff3a2a; background: #2a100e;
    box-shadow: 0 0 8px rgba(255, 40, 32, 0.55);
    position: relative;
  }
  .switch i::after {
    content: ""; position: absolute; top: 2px; left: 2px;
    width: 14px; height: 14px; border-radius: 50%; background: #fff;
    transition: transform 0.15s ease;
  }
  .switch input:checked + i {
    background: #0e2418; border-color: #39e07a;
    box-shadow: 0 0 8px rgba(40, 220, 110, 0.65);
  }
  .switch input:checked + i::after { transform: translateX(16px); background: #fff; }
  .switch input:focus-visible + i { outline: 1px solid var(--terra); outline-offset: 2px; }
  #readout, #hint { font-family: "PingFang HK", "Heiti TC", sans-serif; font-size: 11px; color: #ffc56a; }
  #hint { color: rgba(228, 211, 184, 0.5); margin: 0; }
  .stat { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 4px 10px; border-top: 1px solid #8d6d38; padding: 5px 0; font-family: "PingFang HK", "Heiti TC", sans-serif; font-size: 12px; color: #d4b56a; }
  .stat span { min-width: 0; }
  .stat b { font-weight: 500; text-align: right; flex: none; }
  #card { padding-right: 36px; }
  /* Portrait: height at least the width. The dock stays on the bottom.
     Landscape keeps the side columns. */
  @media (aspect-ratio <= 1) {
    #col-left, #col-right { display: contents; }
    #ui { display: flex; flex-direction: column; align-items: stretch; }
    header.panel { order: 1; align-self: flex-start; width: max-content; max-width: calc(100% - 64px); }
    header.panel h1 { font-size: 18px; }
    /* Same top edge as the clock, on the right. Out of the column so it does not take a row. */
    #tools {
      position: absolute;
      top: max(var(--frame), env(safe-area-inset-top));
      right: max(var(--frame), env(safe-area-inset-right));
      z-index: 6;
      width: auto;
      max-width: none;
    }
    /* Title, tools, pad, and dock keep their height. Open sheets are the
       pieces that shrink, so the sliders stay on screen. */
    header.panel, #tools, #walk-pad, #controls { flex: 0 0 auto; }
    /* One sheet at a time. Each keeps its full text and is scaled to the screen. */
    #legend.open, #card.open {
      order: 3; align-self: stretch; width: auto; max-width: none;
      flex: 0 0 auto; height: auto; max-height: none; overflow: visible;
    }
    #walk-pad { order: 4; align-self: flex-start; }
    #walk-pad.on { margin-top: auto; }
    #controls { order: 5; width: 100%; max-width: none; max-height: min(42dvh, 240px); margin-top: auto; }
    #ui:has(#walk-pad.on) #controls { margin-top: 0; }
    #dock-cut.on { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; align-items: end; }
    #dock-cut .row:last-child { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    #dock-cut .row:last-child label { margin: 0; }
    .tabs button { font-size: 11px; }
    #hint { display: none; }
  }
  @media (aspect-ratio > 1) and (max-height: 540px) {
    #col-left, #col-right { display: flex; }
    #ui {
      grid-template-columns: fit-content(42vw) minmax(64px, 1fr) minmax(0, min(42vw, 340px));
      grid-template-rows: minmax(0, 1fr) auto auto;
      grid-template-areas:
        "left . right"
        "walk . ."
        "dock dock dock";
      row-gap: 6px;
    }
    header.panel, #tools, #legend.open, #card.open { grid-area: auto; max-height: none; }
    #col-left, #col-right { height: auto; max-height: 100%; overflow: auto; align-self: start; }
    #col-left { width: max-content; max-width: 100%; justify-self: start; }
    #col-right { justify-self: end; align-items: flex-end; width: max-content; max-width: min(240px, 100%); }
    #col-right:has(#card.open) {
      width: min(340px, calc(100vw - 2 * var(--frame)));
      max-width: min(340px, calc(100vw - 2 * var(--frame)));
      justify-self: end;
      align-self: start;
      overflow: visible;
      height: auto;
      max-height: none;
    }
    #col-left:has(#legend.open) { align-self: stretch; }
    /* The key sheet can use the width the place card would have taken. */
    #ui:has(#legend.open) {
      grid-template-columns: minmax(0, 1fr) 8px max-content;
    }
    #ui:has(#legend.open) #col-left,
    #ui:has(#legend.open) #col-left:has(#legend.open) {
      width: 100%;
      max-width: 100%;
      overflow: visible;
      height: auto;
      max-height: none;
      align-self: start;
    }
    #ui:has(#legend.open) #legend.open {
      width: 100%;
      max-width: 100%;
      max-height: none;
      overflow: visible;
    }
    header.panel { padding: 8px 12px; width: max-content; max-width: 100%; }
    #controls { max-height: min(38dvh, 156px); padding: 6px; gap: 6px; }
    #dock-cut.on { display: flex; }
    #hint { display: none; }
    h1 { font-size: 18px; }
    #walk-stick { width: 72px; height: 72px; }
    #walk-stick i { width: 30px; height: 30px; }
  }
  @media (aspect-ratio > 1) and (max-height: 540px) and (max-width: 900px) {
    #ui { grid-template-columns: minmax(0, min(30vw, 190px)) minmax(64px, 1fr) minmax(0, min(30vw, 190px)); }
    #col-left, #col-right, #col-right:has(#card.open), #col-left:has(#legend.open) { width: 100%; max-width: 100%; }
    header.panel { padding: 6px 8px; width: max-content; max-width: 100%; }
    header.panel h1, h1 { font-size: 15px; white-space: normal; }
    h1 > .when, #wx-read { flex-wrap: wrap; }
  }
  @media (pointer: coarse) {
    button, #tools button, .tabs button, .switch { min-height: 42px; }
    #card .close { min-width: 42px; min-height: 42px; }
    input[type="range"] { height: 28px; }
    #walk-stick { width: 112px; height: 112px; }
    #walk-stick i { width: 46px; height: 46px; }
  }
  @media (pointer: coarse) and (max-height: 540px) {
    #walk-stick { width: 84px; height: 84px; }
    #walk-stick i { width: 36px; height: 36px; }
  }
  /* The legend is a centered sheet. Type stays at full size; the sheet scrolls. */
  #legend-layer[hidden] { display: none !important; }
  body:has(#legend-layer:not([hidden])) #ui { visibility: hidden; }
  #legend-layer {
    position: fixed; inset: 0; z-index: 30;
    display: grid; place-items: center;
    pointer-events: none;
    padding:
      max(var(--frame), env(safe-area-inset-top))
      max(var(--frame), env(safe-area-inset-right))
      max(var(--frame), env(safe-area-inset-bottom))
      max(var(--frame), env(safe-area-inset-left));
  }
  #legend-scrim {
    position: absolute; inset: 0;
    background: rgba(8, 6, 5, 0.55);
    pointer-events: auto;

function preferredLang() {
  var tag = String((navigator.languages && navigator.languages[0]) || navigator.language || "")
    .toLowerCase()
    .replace(/_/g, "-");
  if (tag === "en" || tag.indexOf("en-") === 0) return "en";
  if (tag === "ja" || tag.indexOf("ja-") === 0) return "ja";
  return "zh";
}
var bootLang = preferredLang();
function bootText(key) {
  var pack = BOOT[bootLang] || BOOT.zh;
  return pack[key] || BOOT.zh[key] || "";
}
function applyBoot() {
  var boot = document.getElementById("boot");
  var title = document.getElementById("boot-title");
  var line = document.getElementById("boot-line");
  if (boot) boot.classList.toggle("lang-en", bootLang === "en");
  if (title) title.textContent = bootText("title");
  if (line) line.textContent = bootText("load");
  document.documentElement.lang = bootLang === "zh" ? "zh-Hant" : bootLang;
}
function bootStage(key) {
  var line = document.getElementById("boot-line");
  if (line) line.textContent = bootText(key);
}
function bootFail() {
  bootStage("fail");
  var boot = document.getElementById("boot");
  if (boot) {
    boot.classList.add("fail");
    boot.setAttribute("aria-busy", "false");
  }
}
applyBoot();

const SITE_W = 210, SITE_D = 120, FLOOR_H = 2.5, MAX_F = 14, ROOF_H = 35, CAP_Y = 45;
// South edge sits 16 m west of the north edge. The lot and the old wall line
// keep that lean. Tenements, the yamen and the temple are rectangular prisms:
// a row shifts west as it goes south, and each wall stays square. The two
// sides of a lane share that shift, so the pavement stays between the walls.
// Outside the walls the ground is the open lot of the 1987 aerials: dust,
// spoil, a few low sheds, and the park paths to the south. Not a traced
// 1905 sheet, and not the Upper City.
const SHEAR = -16;
const SHEAR_K = SHEAR / SITE_D;
const palette = {
  ink: 0x0c0e12, paper: 0xe6e1d6, teal: 0x7d9aa3, brick: 0xa66a54,
  fog: 0x1a2330, terra: 0xb07058, ochre: 0x8a7d52
};
const USES = {
  home:    { color: 0xe6e1d6, name: "Dwelling" },
  factory: { color: 0x8a7d52, name: "Workshop" },
  food:    { color: 0xb07058, name: "Food works" },
  clinic:  { color: 0x7d9aa3, name: "Clinic / dentist" },
  school:  { color: 0x6e8f72, name: "School room" },
  temple:  { color: 0xc4a46a, name: "Temple / hall" },
  shop:    { color: 0xa66a54, name: "Shop / mahjong" },

function cageFace(x, z, w, d) {
  const cx = x + w / 2, cz = z + d / 2;
  let best = null, bestD = 1e9;
  for (const v of VOIDS) {
    if (v.court || v.notch) continue;
    const qx = Math.max(v.x, Math.min(cx, v.x2));
    const qz = Math.max(v.z, Math.min(cz, v.z2));
    const dist = Math.hypot(cx - qx, cz - qz);
    if (dist < bestD) { bestD = dist; best = { dx: qx - cx, dz: qz - cz }; }
  }
  if (!best || bestD > 5) return null;
  if (Math.abs(best.dx) > Math.abs(best.dz)) return best.dx < 0 ? "w" : "e";
  return best.dz < 0 ? "n" : "s";
}

  const facadeIndex = (meta.facade == null ? Math.floor(rnd() * facades.length) : meta.facade) % facades.length;
  const map = facades[facadeIndex].clone();
  map.wrapS = map.wrapT = THREE.RepeatWrapping;
  map.offset.set(rnd(), 0);
  map.repeat.set(0.85 + rnd() * 0.4, 1);
  const wall = new THREE.MeshStandardMaterial({
    map, color: wallColor(), roughness: 0.9 + rnd() * 0.08, metalness: 0.02, clippingPlanes: clips
  });
  attachWetWall(wall);
  const roofMat = addMass.roofMat || (addMass.roofMat = new THREE.MeshStandardMaterial({ color: 0x2a241e, roughness: 0.96, clippingPlanes: clips }));
  const facePlans = streetFaces(x, z, w, d).map(hit => ({
    face: hit.f, clearance: hit.clearance, plans: planShopFace(x, z, w, d, hit.f)
  }));
  const openFaces = facePlans.map(fp => fp.face);
  ["n", "s", "e", "w"].forEach(f => {
    if (openFaces.indexOf(f) >= 0) return;
    const p = facePose(x, z, w, d, f, 0.5, 0.4, 0);
    if (p.x > court.x + 0.15 && p.x < court.x2 - 0.15 && p.z > court.z + 0.15 && p.z < court.z2 - 0.15) openFaces.push(f);
  });
  const framed = makeFramedBlock(w, d, floors, FLOOR_H, openFaces, x, z);
  const frameTint = wallColor();
  frameTint.multiplyScalar(0.88 + rnd() * 0.08);
  const frameMat = new THREE.MeshStandardMaterial({
    map, color: frameTint, roughness: 0.94 + rnd() * 0.04, metalness: 0.03, clippingPlanes: clips
  });
  attachWetWall(frameMat);
  const meshes = [new THREE.Mesh(framed.shell, wall), new THREE.Mesh(framed.frame, frameMat)];
  meshes.forEach(mesh => mesh.position.set(x + w / 2, 0, z + d / 2));
  const rooms = [];
  const shopFace = facePlans.length ? facePlans[0].face : null;
  const shopKindName = shopFace ? facePlans[0].plans[0].kind : null;
  const useKeys = meta.bias || ["home", "home", "factory", "food", "shop", "service"];
  for (let f = 0; f < floors; f++) {
    const cols = Math.max(1, Math.round(w / 3.2));
    const rows = Math.max(1, Math.round(d / 3.2));
    for (let i = 0; i < cols; i++) {
      for (let j = 0; j < rows; j++) {
        let use = useKeys[(f * 3 + i + j * 2) % useKeys.length];
        if (f === 0 && shopKindName) use = SHOP_KIND[shopKindName].use;
        else if (f === 0 && meta.ground) use = meta.ground;
        const clinicUp = shopKindName === "dentist" ? 3 : shopKindName === "doctor" ? 2 : 0;
        if (clinicUp && f > 0 && f < clinicUp && streetCell(i, j, shopFace, cols, rows)) use = "clinic";
        if (i === 0 && j === 0) use = "service";
        rooms.push({ use, f, i, j, cols, rows });
      }
    }
  }
  const data = {
    floors, w, d, x, z, rooms,
    zone: meta.zone, street: meta.street, name: meta.name || meta.street, chapter: meta.chapter,
    facadeIndex,
    shops: facePlans.reduce((acc, fp) => acc.concat(fp.plans.map(p => p.kind)), [])
  };
  meshes.forEach(mesh => {
    mesh.geometry.userData.pack = 1;
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    mesh.userData = data;
    city.add(mesh);
    pickables.push(mesh);
  });
  massCount++;
  const roofSlab = new THREE.Mesh(new THREE.BoxGeometry(Math.max(0.5, w - 0.3), 0.16, Math.max(0.5, d - 0.3)), roofMat);
  roofSlab.geometry.userData.pack = 2;
  roofSlab.position.set(x + w / 2, h + 0.08, z + d / 2);
  roofSlab.userData = { roof: 1 };
  city.add(roofSlab);
  roofMeshes.push(roofSlab);

  facePlans.forEach(fp => {
    fp.plans.forEach(p => placeBay(p.bay, fp.face, p.kind, p.rng, data, fp.clearance, z));
  });
  if (meta.vents) {
    const duct = new THREE.Mesh(
      new THREE.BoxGeometry(0.45, 1.6, 0.45),
      addMass.ductMat || (addMass.ductMat = new THREE.MeshStandardMaterial({
        map: roofKitTexOf("galv"), color: 0x8a7c68, roughness: 0.9, metalness: 0.1, clippingPlanes: clips
      }))
    );
    duct.position.set(x + w * 0.55, h + 0.85, z + d * 0.5);
    city.add(duct);
  }
  if (meta.buckets) {
    const bucket = new THREE.Mesh(
      new THREE.CylinderGeometry(0.28, 0.22, 0.38, 8),
      addMass.bucketMat || (addMass.bucketMat = new THREE.MeshStandardMaterial({ map: pipeStainMap(), color: 0x5a6460, roughness: 0.9, metalness: 0.04, clippingPlanes: clips }))
    );
    bucket.position.set(x + 0.7, 0.28, z + 0.7);
    city.add(bucket);
  }
  addAnchor(x, z, w, d);
  walkSolids.push({ x, z, x2: x + w, z2: z + d });
  dressRoof(x, z, w, d, h);
  return data;
}

function segNS(x, z0, z1, width) {
  return { x: x - width / 2, z: z0, x2: x + width / 2, z2: z1 };
}
function segEW(z, x0, x1, width) {
  return { x: x0, z: z - width / 2, x2: x1, z2: z + width / 2 };
}

const dummy = new THREE.Object3D();
function rebuildRooms() {
  const counts = {};
  Object.keys(USES).forEach(k => counts[k] = 0);
  const seen = new Set();
  pickables.forEach(mesh => {
    const u = mesh.userData;
    if (!u.rooms || seen.has(u)) return;
    seen.add(u);
    u.rooms.forEach(room => {
      const key = room.use;
      const inst = roomMeshes[key];
      if (!inst || counts[key] >= 20000) return;
      const rw = (u.w - 0.8) / room.cols;
      const rd = (u.d - 0.8) / room.rows;
      dummy.position.set(
        u.x + 0.4 + rw * (room.i + 0.5),
        room.f * FLOOR_H + 1.15,
        u.z + 0.4 + rd * (room.j + 0.5)
      );
      dummy.scale.set(Math.max(0.4, (rw - 0.25) / 2.4), 1, Math.max(0.4, (rd - 0.25) / 2.4));
      dummy.updateMatrix();
      inst.setMatrixAt(counts[key]++, dummy.matrix);
    });
  });
  Object.keys(USES).forEach(k => {
    roomMeshes[k].count = counts[k];
    roomMeshes[k].instanceMatrix.needsUpdate = true;
  });
}

function focusViewButton() {

  const on = row.querySelector("button.on");
  if (!on || row.clientWidth <= 0) return;
  const pad = 12;
  const rowBox = row.getBoundingClientRect();
  const box = on.getBoundingClientRect();
  let delta = 0;
  if (box.left < rowBox.left + pad) delta = box.left - rowBox.left - pad;
  else if (box.right > rowBox.right - pad) delta = box.right - rowBox.right + pad;
  else return;

  row.scrollLeft = Math.max(0, Math.min(max, row.scrollLeft + delta));

  camera.aspect = w / h;

      loyan: "老人街，英文 Lo Yan Street。南口在龍津道一一二號與一一四號之間，一九五〇年代初才有。這條街在城南，不是衙署天井東側。安老院和後來的老人中心、青少年中心是衙署那一組，一九九三年留下的是衙署，不是四周的唐樓。",
      kwong: "城內最暗的巷。魯金記：檔口點蠟燭給人認路，故稱光明街；英文展板作 Kwong Ming Street。後來食品工場集中，魚蛋、麵廠和燒味在此。色物語：下層不見日，光管色溫不同，切開才見五色。",
      shing: "舊東門一線，與東正道平行。北口開向東頭村道。居民稱為龍城路，龍城即寨城簡稱。英文檔案作 Lung Shing Road。南口夾在龍津路與龍津道之間、益華樓與東南樓之中，城外看不見。鳥籠物語是鐵窗花、晾衣，和伸出巷上的露台。",
      szkung: "社公街因社壇得名。測量圖英文作 SZ KUNG ST，故用 Sz Kung Street；維基百科的 Si Kung 是另一種拼法。畫上的線是示意，不是測繪中線。",
      chun: "城內最老的街，東西向，對準城東、後來埋在啟德地下的龍津石橋，不是南門。街冊英文作 Lung Chun Avenue，以別於一九五一年才開的龍津道。龍津義學是衙署以外的另一座清建築，沿這條街。到一九八七年，原址已是唐樓義學大樓。書中剖面把它畫在龍如樓與東升樓之間。這幅模型沒有單獨標出那一座。",
      tsun: "南面城基拆後，一九五一年樓房夾出的路，用「道」字和龍津路分開，取「聚龍通津」。魯金記麻雀館、牌九、番攤、狗肉檔、煙館集中於此。英文作 Lung Tsun Road。",
      lane: "龍津路支巷，街冊作龍津橫巷。すきま物語：約一米的隙、滴水喉管、樓與樓之間的垃圾網，以及不落地的路徑。",
      yamen: "九龍巡檢司衙署，城內唯一留到清拆的清代建築。單層三進兩院：前進兩側是耳房，中進是公堂，後進是官邸。青磚、麻石柱礎，柱和山牆承檩，屋面是素燒筒瓦和布瓦。模型屋脊約六米半，四周唐樓留高，天井才像一個坑。一八九九年以後做過安老院、學校和診所。這裡的學校是廣蔭院的學額，不是龍津義學。約一九〇六年石門額刻上 ALMSHOUSE；廣蔭院一九六九年遷去鑽石山，這幾個字在一九八七年還在。公園一九九五年才寫的門聯，這幅圖不放。晚期照片裡，天井上方有一張網，接著唐樓扔下的垃圾。一八〇二年的兩門炮見於二十世紀初的照片，一九九六年修復後又放回入口兩側；這幅一九八七年的圖不把炮放回去。",
      temple: "城寨這座天后廟是一九五一年所建。海邊的舊廟被清拆後，坊眾把神像遷入，廟廳放在北面天后廟街的中段，青磚、素燒瓦頂，門向南。通向廟門的是一條濕窄巷。門與街之間是一小天井，上張鐵網，承接樓上扔下的垃圾，網眼裡偶有天光。香爐一個，在門前。神像在廳內，不放在街上。天后廟後街是朝光明街的橫巷。城邊另有一座福德祠，位置沒有測到這張圖上，模型不另起一座。廟與城寨一同清拆，天后像後移打鼓嶺道九龍城天后會。生活復元パノラマ把神廳和廚房畫在同一帶。",
      core: "這座樓不臨有名字的街。書裡的暗核是住戶和工場，地面多是一扇門。街名只留給真正開向那條街的舖。"

    legendNote: "Zones follow the book’s chapter headings, kept in Japanese as printed. 色物語: no sun downstairs, fluorescent tubes of different colour temperatures. 鳥籠物語: lit windows sit inside continuous cantilevered wire-mesh balconies, the glass behind the mesh. A flower cage runs across several windows on the same floor. The balconies are shallow, deep, rusted, tarp-covered or hung with laundry. The north front carries the longest and the deepest. A lane about a metre wide gets only a short projection, so the two sides do not meet. The dark core has none. すきま物語: metre-wide gaps, drip, refuse nets. 生活物語: the great well lasted until the 1950s, then eight municipal pipes, and water carried upstairs. Ground floors follow photographs from about 1987. They are not a shop-by-shop survey. In the photographs, dental signs stack on West City Road. Kwong Ming Street is fish balls, noodle works and roast meat. Lung Chun Avenue by then was groceries and family workshops. Lung Tsun Road still has mahjong, dispensaries and cooked food. A lane about a metre wide is mostly a metal gate. Inside the walls the sign is painted on the shop. Outside, on Tung Tau Tsuen Road, Tung Tsing Road and Carpenter Road, blade signs project over the pavement: boards of different sizes, set at irregular intervals. They name the trade, not an unsurveyed shop. Herbal shops keep large metal urns, a dispensary is a wall of drawers, noodle rooms have no window and flour on the table, roast meat hangs in front of the furnace, and mahjong and pai kau keep a cloth across the door. Roofs follow late-1980s photographs: galvanized tanks and fishbone aerials stand on the roof face, with zinc huts and washing lines. Bamboo scaffolds stand off some alley walls and stay out of the metre lanes. Alleys are worn wet concrete, cracked, patched and pooled, with a channel along one wall. On a narrow lane the first floor closes in stretches of concrete, boards or zinc, so daylight comes in at the crossings. Pipes, cables, drips and fluorescent tubes of different colour temperatures run under that ceiling, and refuse nets cross the open gaps. Wider streets keep a high cable, a few tubes under the first floor, and the odd basin, crate or plastic stool against the wall, clear of the walking line. People in the alleys follow the same photographs: singlets, short sleeves, rubber slippers, plastic bags, baskets, a shoulder pole and buckets. Umbrellas open only in the rain. They are not a count of residents. A few also walk the building side of Tung Tau Tsuen Road, Tung Tsing Road and Carpenter Road. The book’s panorama puts a widebody on the flight path and cream-and-red buses on the outer roads. This model flies one widebody low over the south roofs, gear down, eastbound on the approach, in period colours and with no airline name. The outer roads keep the cream-and-red buses and city traffic, in livery only. Window units, bamboo poles, downpipes and cage grilles follow the same photographs and sit on the outer faces, densest on the north front. The dark alleys do not grow air-conditioners.",

    chapters: { life: "生活物語", colour: "色物語", cage: "鳥籠物語", enter: "九龍城へ", panorama: "生活復元パノラマ", gap: "すきま物語", altar: "社壇" },
    notes: {
      west: "West wall line. Its north end is the easiest entrance off Tung Tau Tsuen Road. More than a hundred unlicensed dentists stacked signs along this street. The denser row in the photographs is outside the city: in 1987 both Greg Girard and Andrew Suddaby shot dentist shops on the north front from Tung Tau Tsuen Road. Hong Kong did not recognise the licences. 西城路 is the only internal street whose English name is a translation, West City Road. The others keep the romanizations on the sheet and the plaques.",
      well: "大井街 is older than the walled city and is named for the great well, the city’s main source. The cholera sealing of wells in the 1920s and 1930s did not close this one. It lasted until the 1950s, then eight municipal pipes replaced it. In this 1987 view the mouth is a concrete cap, not a well still in use. Eight is a count. The positions are not mapped, so the model marks the count with eight street taps on the north pavement. The English name is Tai Chang Street. The life chapter is about water that did not run all day: buckets, stored bathtubs, and carriers paid to haul it upstairs.",
      loyan: "Lo Yan Street. Its south mouth opens on Lung Tsun Road between nos 112 and 114, and the street dates from the early 1950s. It lies in the south of the city, not on the east side of the yamen court. The almshouse, and later the old people’s centre and the youth centre, were the yamen compound. What was kept in 1993 was the yamen, not the tenements around it.",
      kwong: "The darkest alley. Lu Jin records candle-lit stalls for people finding their way, hence 光明街; the park plaque gives Kwong Ming Street. Later the food works concentrated here: fish balls, noodle works and roast meat. 色物語: no sun downstairs, so tubes of different colour temperatures make the cut a patchwork.",
      shing: "Old east-gate line, parallel to Tung Tsing Road, its north end opening on Tung Tau Tsuen Road. Residents called it 龍城路, 龍城 being the short name of the city; archives give Lung Shing Road. The south mouth sits between Lung Chun Avenue and Lung Tsun Road, hidden between 益華樓 and 東南樓. 鳥籠物語 is the cage-balcony chapter.",
      szkung: "社公街 is named for the she altar, 社壇. The sheet prints SZ KUNG ST, so the English name here is Sz Kung Street. Wikipedia’s Si Kung is the other spelling. The line drawn is diagrammatic, not a surveyed centreline.",
      chun: "Oldest internal street, running east–west toward the Lung Tsun Stone Bridge east of the city, later buried under Kai Tak. It is not the south gate. Street lists give Lung Chun Avenue, distinct from Lung Tsun Road, which was cut in 1951. 龍津義學 was the other Qing building, on this street and distinct from the yamen. By 1987 the site was the tenement 義學大樓. The book’s section draws it between 龍如樓 and 東升樓. This model does not mark that tower.",
      tsun: "Opened in 1951 on the demolished south wall, named 龍津道 — a 道, not a 路 — for 聚龍通津, to distinguish it from Lung Chun Avenue. Lu Jin places mahjong, pai kau, fan-tan, dog-meat stalls and opium dens here. The English name is Lung Tsun Road.",
      lane: "Lung Chun Lane, recorded as 龍津橫巷, a branch of Lung Chun Avenue. すきま物語: metre-wide slits, dripping pipes, refuse nets, and routes that never touch the ground.",
      yamen: "Yamen of the Kowloon assistant magistrate, the only Qing building to survive until demolition. One storey, three halls and two courts: ear rooms flank the front hall, the middle hall was the public court, and the rear hall the residence. Grey brick and granite bases. Columns and gable walls carry the purlins, under a roof of unglazed barrel tiles and flat tiles. The ridge is about 6.5 m, and the tenements stay tall so the courts read as a pit. After 1899 it was an almshouse, a school and a clinic. That school belonged to 廣蔭院, and it is not 龍津義學. About 1906 the stone lintel was cut with ALMSHOUSE. The home, later called 廣蔭院, left for Diamond Hill in 1969; the letters are still on the gate in this 1987 view. The couplets beside the gate were written for the park in 1995, so they are not here. Late photographs show a wire net over the courts, holding refuse thrown from the towers. Two muzzle-loading cannon dated 1802 appear in early-twentieth-century photographs and again beside the entrance after the 1996 restoration. This 1987 view does not put them back.",
      temple: "The Tin Hau temple inside the Walled City was built in 1951, after an older hall by the shore was cleared and the image was brought in. It stands in the north district, one grey-brick hall across 天后廟街, unglazed tiles, door to the south. A wet ginnel leads to the gate. Between the door and the street is a small court. Wire netting over it holds the rubbish thrown from the windows, and a little daylight comes through the mesh. One incense burner stands in front of the door. The image is inside the hall, not in the street. 天后廟後街 is the side lane toward Kwong Ming Street. A Fuk Tak shrine stood at the edge of the city. Its site is not fixed on this plan, so the model does not add a second hall. The temple was cleared with the city; the image later stood with the Kowloon City Tin Hau Association on Tak Ku Ling Road. The panorama sets shrines beside kitchens.",
      core: "This block does not front a named street. In the book the dark core is dwellings and workshops, and the ground is often only a door. A street name is kept for the shops that open onto that street."

    legendNote: "区分は書の章題のまま。色物語は下層に日が差さず蛍光灯の色温度が並ぶこと。鳥籠物語は、光のある窓を連続した持ち出しの金網バルコニーに収め、ガラスは網の内側にある。花籠は同じ階の複数の窓にまたがる。浅いもの、深いもの、錆びたもの、タープを掛けたもの、洗濯物を干したものがある。北面が最も長く深い。幅一メートルほどの巷は出を短くし、向かいと触れない。暗い核には置かない。すきま物語は約一メートルの隙間、滴る管、ごみ網。生活物語は一九五〇年代まで残った大井と、その後の市政の水管八本、楼上へ運ぶ水。地下の店先は一九八七年頃の写真に合わせたもので、一軒ずつの測量ではない。写真では西城路に歯科の招牌が壁へ重なる。光明街は魚団子、製麺、焼味。龍津路はこの時期、雑貨と家庭工場が多い。龍津道には麻雀、薬舗、食肆が残る。幅一メートルほどの横巷は、たいてい鉄の扉だけである。城内の招牌は店の壁に書く。城外の東頭村道、東正道、賈炳達道では、刀牌が路面へ突き出す。板の大きさはまちまちで、通りに沿って間隔も揃えない。書くのは業種だけで、測っていない店名は書かない。涼茶は大きな金属の壺。薬房は引き出しの壁。製麺は窓がなく、粉が台を覆う。焼味は炉の前に吊る。麻雀と牌九は布で入口を隠す。屋上は一九八〇年代末の写真に合わせ、亜鉛メッキの円形水槽と魚骨アンテナを屋上面に置く。トタン小屋と物干しもある。竹の足場は一部の路地の壁から出し、幅一メートルの巷は通す。路地は摩耗してひび割れた湿ったコンクリートで、補修跡、染み、水たまりがあり、壁際に側溝が一本ある。狭い巷は一階の床がコンクリート、板、トタンで途切れ途切れに塞がり、昼の光は辻から入る。その天井下に管、電線、滴り、色温度の違う蛍光灯が走り、開いた隙間にごみ網がかかる。広い街は高い位置の線と、一階の下の蛍光灯を数本置き、壁際にたらい、箱、プラスチックの腰掛けを置く。通りの中央は空けてある。路地の人は同じ時期の写真に合わせ、ランニング、半袖、ゴム草履、袋、籠、天秤棒と桶にする。傘は雨のときだけ開く。人数は居住者の数ではない。東頭村道、東正道、賈炳達道では、建物側を歩く人もいる。書のパノラマには航路へ入るワイドボディと、外周のクリームと赤の二階バスがある。この模型は、脚を出したワイドボディが一機、南の屋根のすぐ上を東へ進み航路へ入る。塗装は時代の色だけで、航空会社の名前は書かない。外周のバスと車も塗色だけである。窓用冷房、竹竿、竪樋、鉄格子は同じ時期の写真に合わせ、外壁に置く。北面が最も密で、暗い路地には冷房を付けない。",
